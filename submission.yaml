submission:
  title: "GridGuard AI – Outage & Equipment Failure Advisor"
  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities $1M+/hour.
    Most utilities still use calendar-based maintenance while sensors already show failure
    signatures weeks in advance. Weather forecasts are never combined with sensor data
    in time to act.
  solution_summary: >
    GridGuard AI is a zero-install browser dashboard that scores every grid asset with an
    explainable 7-factor risk model (age, hotspot temperature, vibration, partial discharge,
    oil quality, days since maintenance, weather severity). It then re-ranks CRITICAL/HIGH
    assets by risk × grid-impact and generates a prioritised maintenance & crew
    pre-positioning plan with one click.
  key_features:
    - "Explainable risk score (0-100) using 7 weighted, fully transparent factors"
    - "One-click Maintenance & Crew Plan Generator (risk × grid-impact ranking)"
    - "Live sortable table + Top-8 risk chart"
    - "Zero-install single HTML file – runs anywhere with no API keys or backend"
    - "IBM Bob used for scaffolding the risk engine, iterating the plan logic, and final code review"
