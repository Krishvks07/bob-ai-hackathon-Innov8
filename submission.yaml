submission:
  title: "GridGuard AI – Outage & Equipment Failure Advisor"
  problem_statement: >
    Power transformer and substation failures cause blackouts costing utilities $1M+/hour.
    Most utilities still use calendar-based maintenance while sensors already show failure
    signatures weeks in advance. Weather events compound the risk but are never combined
    with sensor data in time to act.
  solution_summary: >
    GridGuard AI is an explainable, zero-install browser dashboard that scores every grid
    asset (0-100) using seven weighted factors (age, hotspot temperature, vibration,
    partial discharge, oil quality, days since maintenance, weather severity). It then
    re-ranks critical assets by risk × grid-impact and generates a prioritised 24-48h /
    5-7 day maintenance & crew pre-positioning plan.
  key_features:
    - "Explainable multi-factor risk score (0-100) with full transparency of weights"
    - "Risk × grid-impact re-ranking so high-impact assets (hospitals, critical feeders) are prioritised"
    - "One-click Maintenance & Crew Plan generator with time windows"
    - "Zero dependencies – single HTML file that runs offline in any browser"
    - "Built with IBM Bob assistance for scaffolding, iteration and code review"
